<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPS-TOPIK Study Hub - Modern Design</title>
    <!-- Load Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); /* Deep Purple Gradient */
            background-attachment: fixed;
            min-height: 100vh;
            color: #1f2937;
            padding: 0;
            margin: 0;
        }

        /* Container Full Screen */
        #app {
            width: 100vw;
            height: 100vh;
            border-radius: 0 !important; 
            overflow: hidden;
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: #818cf8;
        }

        /* Navigation Styles */
        .nav-link {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-weight: 600;
            color: #4b5563;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-link:hover {
            background-color: rgba(99, 102, 241, 0.1);
            color: #4f46e5;
        }

        .nav-link.active {
            background-color: #4f46e5;
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        /* Mobile Menu Transition */
        #mobile-menu {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }

        #mobile-menu.open {
            max-height: 400px;
            opacity: 1;
            margin-top: 1rem;
        }

        /* Custom Scrollbar */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Chat Bubbles */
        .user-message {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border-radius: 20px 20px 4px 20px;
        }
        .ai-message {
            background: white;
            color: #374151;
            border-radius: 20px 20px 20px 4px;
            border: 1px solid #e5e7eb;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* Phone Call Animations */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(99, 102, 241, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        }
        
        .avatar-pulse {
            animation: pulse-ring 2s infinite;
        }

        .avatar-speaking {
             animation: pulse-ring 1s infinite;
             box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.7) !important;
        }

        .avatar-error {
            border-color: #ef4444 !important; /* Red border */
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Main App Container -->
    <div id="app" class="glass-panel flex flex-col">
        
        <!-- Header & Navigation -->
        <header class="p-4 md:p-6 border-b border-white/50 bg-white/40 sticky top-0 z-50 backdrop-blur-md">
            <div class="flex justify-between items-center max-w-7xl mx-auto">
                <!-- Logo / Title -->
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-600 text-white p-2 rounded-lg shadow-lg">
                        <i data-lucide="book-open" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-xl md:text-2xl font-bold text-gray-800 tracking-tight leading-none">EPS-TOPIK</h1>
                        <p class="text-xs text-gray-600 font-medium">Study Hub</p>
                    </div>
                </div>

                <!-- Desktop Navigation (Visible on MD+) -->
                <nav class="hidden md:flex gap-2">
                    <button class="nav-link active" onclick="showTab('vocab-textbook', this)">
                        <i data-lucide="book-open-text" class="w-4 h-4 mr-2"></i>Kosakata
                    </button>
                    <button class="nav-link" onclick="showTab('hangeul', this)">
                        <i data-lucide="scan" class="w-4 h-4 mr-2"></i>Hangeul
                    </button>
                    <button class="nav-link" onclick="showTab('grammar', this)">
                        <i data-lucide="book-open-check" class="w-4 h-4 mr-2"></i>Tata Bahasa
                    </button>
                    <button class="nav-link" onclick="showTab('chat-ai', this)">
                        <i data-lucide="message-square-heart" class="w-4 h-4 mr-2"></i>Chat AI
                    </button>
                </nav>

                <!-- Mobile Burger Button (Visible on small screens) -->
                <button id="burger-btn" onclick="toggleMenu()" class="md:hidden p-2 text-gray-700 hover:bg-white/50 rounded-lg transition">
                    <i data-lucide="menu" class="w-7 h-7"></i>
                </button>
            </div>

            <!-- Mobile Navigation Menu (Dropdown) -->
            <div id="mobile-menu" class="flex flex-col gap-2 md:hidden px-1 max-w-7xl mx-auto">
                <button class="nav-link w-full active" onclick="showTab('vocab-textbook', this)">
                    <i data-lucide="book-open-text" class="w-5 h-5 mr-3"></i>Kosakata Textbook
                </button>
                <button class="nav-link w-full" onclick="showTab('hangeul', this)">
                    <i data-lucide="scan" class="w-5 h-5 mr-3"></i>Hangeul & Pelafalan
                </button>
                <button class="nav-link w-full" onclick="showTab('grammar', this)">
                    <i data-lucide="book-open-check" class="w-5 h-5 mr-3"></i>Tata Bahasa
                </button>
                <button class="nav-link w-full" onclick="showTab('chat-ai', this)">
                    <i data-lucide="message-square-heart" class="w-5 h-5 mr-3"></i>Chat AI Praktik
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-grow overflow-y-auto custom-scroll p-4 md:p-8 bg-white/30 relative">
            
            <div class="max-w-7xl mx-auto">
            <!-- 1. Kosakata Textbook -->
            <div id="vocab-textbook" class="tab-content animate-fade-in space-y-6">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800">Kosakata Textbook 2024</h2>
                        <p class="text-gray-500 text-sm">Persiapan ujian EPS-TOPIK per bab.</p>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                        <select id="vocab-chapter-filter" onchange="filterVocabTextbook()" class="p-2.5 rounded-xl border-0 ring-1 ring-gray-200 bg-white/80 focus:ring-2 focus:ring-indigo-500 outline-none text-sm shadow-sm">
                            <option value="">Semua</option>
                            <option value="BAB 1">BAB 1 자기소개 (Perkenalan diri)</option>
                            <option value="BAB 2">BAB 2 생활용품 (Barang kebutuhan sehari-hari)</option>
                            <option value="BAB 3">BAB 3 위치와 장소 (Tempat & lokasi)</option>
                            <option value="BAB 4">BAB 4 동작과 사물 (Aksi & benda)</option>
                            <option value="BAB 5">BAB 5 날짜와 요일 (Hari & tanggal)</option>
                            <option value="BAB 6">BAB 6 하루 일과 (Rutinitas sehari-hari)</option>
                            <option value="BAB 7">BAB 7 계절과 날씨 (Cuaca & musim)</option>
                            <option value="BAB 8">BAB 8 가족 과 친구 (Teman & keluarga)</option>      
                            <option value="BAB 9">BAB 9 음식 주문 (Memesan makanan)</option>   
                            <option value="BAB 10">BAB 10 물건 구입 (Membeli barang)</option>    
                            <option value="BAB 11">BAB 11 집안일 (Pekerjaan dalam rumah)</option>
                            <option value="BAB 12">BAB 12 대중교통 (Transportasi umum)</option>
                            <option value="BAB 13">BAB 13 주말 활동 (Aktivitas akhir pekan)</option>
                            <option value="BAB 14">BAB 14 길 찾기 (Mencari jalan)</option>
                            <option value="BAB 15">BAB 15 옷차림 (Berpakaian)</option>
                            <option value="BAB 16">BAB 16 집 구하기 (Mencari rumah)</option>
                            <option value="BAB 17">BAB 17 휴가 (Cuti)</option>
                            <option value="BAB 18">BAB 18 취미 (Hobi)</option>
                            <option value="BAB 19">BAB 19 요리 (Memasak)</option>
                            <option value="BAB 20">BAB 20 인터넷과 스마트폰 (Internet dan smartphone)</option>
                        </select>
                        <div class="relative w-full sm:w-64">
                            <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-gray-400"></i>
                            <input type="text" id="vocab-textbook-search" oninput="filterVocabTextbook()" placeholder="Cari kata..." class="w-full pl-9 p-2.5 rounded-xl border-0 ring-1 ring-gray-200 bg-white/80 focus:ring-2 focus:ring-indigo-500 outline-none text-sm shadow-sm">
                        </div>
                    </div>
                </div>

                <div id="vocab-textbook-list" class="grid grid-cols-1 gap-4">
                    <!-- Vocab rendered here -->
                </div>
            </div>

            <!-- 2. Hangeul -->
            <div id="hangeul" class="tab-content hidden animate-fade-in space-y-6">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">Belajar Hangeul</h2>
                    <p class="text-gray-500 text-sm">Klik kartu untuk mendengarkan. Perhatikan bunyi <b>Awal</b> (depan) dan <b>Akhir</b> (Batchim).</p>
                </div>
                <div id="hangeul-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 md:gap-4 pb-8">
                    <!-- Hangeul rendered here -->
                </div>
            </div>

            <!-- 3. Grammar -->
            <div id="grammar" class="tab-content hidden animate-fade-in space-y-6">
                 <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800">Tata Bahasa</h2>
                        <p class="text-gray-500 text-sm">Struktur kalimat dasar hingga menengah.</p>
                    </div>
                    <div class="relative w-full md:w-64">
                         <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-gray-400"></i>
                        <input type="text" id="grammar-search" oninput="filterGrammar()" placeholder="Cari grammar..." class="w-full pl-9 p-2.5 rounded-xl border-0 ring-1 ring-gray-200 bg-white/80 focus:ring-2 focus:ring-indigo-500 outline-none text-sm shadow-sm">
                    </div>
                </div>
                <div id="grammar-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Grammar rendered here -->
                </div>
            </div>

            <!-- 4. Chat AI -->
            <div id="chat-ai" class="tab-content hidden animate-fade-in h-full flex flex-col">
                <div class="flex flex-wrap justify-between items-center mb-4 gap-2">
                    <h2 class="text-2xl font-bold text-gray-800">Tutor AI Korea</h2>
                    <div class="flex gap-2 items-center">
                         
                        <!-- Call Mode Button -->
                        <button onclick="startCallMode()" class="bg-indigo-600 text-white px-3 py-2 rounded-lg text-sm flex items-center shadow-md hover:bg-indigo-700 transition">
                            <i data-lucide="phone-call" class="w-4 h-4 mr-2"></i> Call Mode
                        </button>

                        <button onclick="resetChat()" class="p-2 text-red-500 hover:bg-red-50 rounded-lg transition" title="Reset Chat">
                            <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <!-- Settings Bar -->
                 <div class="flex flex-wrap gap-2 mb-2 bg-white/50 p-2 rounded-lg border border-gray-100">
                    <select id="ai-mode" class="p-1.5 rounded-md text-sm bg-white border border-gray-200 focus:outline-none focus:border-pink-500 font-medium text-pink-700" onchange="resetChat()">
                        <option value="conversation">Mode: Percakapan Santai</option>
                        <option value="tutor">Mode: Tutor (Koreksi)</option>
                    </select>

                    <select id="ai-level" class="p-1.5 rounded-md text-sm bg-white border border-gray-200 focus:outline-none focus:border-indigo-500" onchange="resetChat()">
                        <option value="Pemula">Level: Pemula</option>
                        <option value="Dasar">Level: Dasar</option>
                        <option value="Menengah">Level: Menengah</option>
                    </select>
                </div>

                <div id="chat-box" class="flex-grow bg-white/60 rounded-2xl p-4 overflow-y-auto custom-scroll space-y-4 shadow-inner border border-gray-100 mb-4 h-[50vh]">
                     <!-- Initial Message is set by resetChat() -->
                </div>

                <!-- Chat Input Area -->
                <div class="relative">
                    <div id="loading-indicator" class="hidden absolute -top-8 left-0 text-xs text-indigo-600 font-semibold flex items-center">
                        <i data-lucide="loader-2" class="w-3 h-3 animate-spin mr-1"></i> Mengetik...
                    </div>
                    <div id="error-message" class="hidden absolute -top-10 left-0 right-0 bg-red-100 text-red-600 text-xs p-2 rounded-lg text-center border border-red-200"></div>

                    <div class="flex gap-2">
                        <input type="text" id="user-input" class="flex-grow p-4 rounded-xl border-0 ring-1 ring-gray-200 focus:ring-2 focus:ring-indigo-500 shadow-lg outline-none transition" placeholder="Tulis pesan..." onkeydown="handleChatEnter(event)">
                        <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-xl shadow-lg transition transform active:scale-95 flex items-center justify-center">
                            <i data-lucide="send" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </div>
            </div>

        </main>
    </div>

    <!-- CALL MODE OVERLAY -->
    <div id="call-modal" class="fixed inset-0 bg-gray-900/95 z-[60] hidden flex flex-col items-center justify-center text-white backdrop-blur-xl transition-all duration-300">
        <div class="absolute top-6 right-6">
            <button onclick="endCallMode()" class="bg-gray-800 p-3 rounded-full hover:bg-gray-700 transition" title="Tutup">
                <i data-lucide="x" class="w-6 h-6 text-white"></i>
            </button>
        </div>

        <div class="flex flex-col items-center space-y-8 w-full max-w-md px-6">
            <!-- Avatar & Animation -->
            <div class="relative">
                <div id="avatar-ring" class="absolute inset-0 rounded-full bg-indigo-500 opacity-20 transform scale-150"></div>
                <div id="avatar-circle" class="w-32 h-32 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shadow-2xl relative z-10 border-4 border-white/20 transition-colors">
                    <i data-lucide="bot" class="w-16 h-16 text-white"></i>
                </div>
            </div>

            <!-- Status Text -->
            <div class="text-center space-y-2">
                <h2 id="call-status" class="text-2xl font-bold tracking-wide">Menghubungkan...</h2>
                <div id="live-transcript" class="min-h-[64px] flex items-center justify-center text-center text-indigo-200 text-lg font-['Noto_Sans_KR'] px-4 mt-2 w-full leading-relaxed">
                    ...
                </div>
            </div>

            <!-- Controls (Single Big Button) -->
            <div class="flex flex-col items-center gap-6 mt-4 w-full">
                <!-- Main Talk Button -->
                <button id="main-talk-btn" onclick="toggleMic()" class="group relative flex items-center justify-center gap-3 px-8 py-5 rounded-full transition-all duration-300 transform active:scale-95 shadow-2xl w-full max-w-[280px] bg-red-500 hover:bg-red-600 text-white">
                    <i id="btn-icon" data-lucide="mic-off" class="w-6 h-6"></i>
                    <span id="btn-text" class="font-bold text-lg tracking-wide">Mic Mati</span>
                </button>
                
                <!-- Helper Text / Exit -->
                <button onclick="endCallMode()" class="text-white/40 text-sm hover:text-white transition">
                    Akhiri Panggilan
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // ==========================================
        // UI LOGIC (Responsive Menu)
        // ==========================================
        
        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            const btn = document.getElementById('burger-btn');
            
            if (menu.classList.contains('open')) {
                menu.classList.remove('open');
                // Change back to menu icon
                btn.innerHTML = '<i data-lucide="menu" class="w-7 h-7"></i>';
            } else {
                menu.classList.add('open');
                // Change to X icon
                btn.innerHTML = '<i data-lucide="x" class="w-7 h-7"></i>';
            }
            // Re-render icons for the new element
            lucide.createIcons();
        }

        function showTab(tabId, element) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            
            // Show selected tab
            document.getElementById(tabId).classList.remove('hidden');

            // Handle Active State for Buttons (Desktop & Mobile)
            document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
            
            // Since we have duplicate buttons (mobile & desktop), activate both corresponding buttons
            // In a real app we might bind by ID, but simple class matching works here
            const textContent = element.textContent.trim();
            document.querySelectorAll('.nav-link').forEach(btn => {
                if(btn.textContent.trim() === textContent) {
                    btn.classList.add('active');
                }
            });

            // Close mobile menu if open
            const menu = document.getElementById('mobile-menu');
            if (menu.classList.contains('open')) {
                toggleMenu();
            }

            if (tabId === 'vocab-textbook') filterVocabTextbook();
        }

        // ==========================================
        // DATA
        // ==========================================
        const hangeulData = [
            // --- KONSONAN DASAR ---
            { hangeul: "ㄱ", rom: "g/k", type: "Konsonan Dasar", awal: "G", akhir: "K" },
            { hangeul: "ㄴ", rom: "n", type: "Konsonan Dasar", awal: "N", akhir: "N" },
            { hangeul: "ㄷ", rom: "d/t", type: "Konsonan Dasar", awal: "D", akhir: "T" },
            { hangeul: "ㄹ", rom: "r/l", type: "Konsonan Dasar", awal: "R/L", akhir: "L" },
            { hangeul: "ㅁ", rom: "m", type: "Konsonan Dasar", awal: "M", akhir: "M" },
            { hangeul: "ㅂ", rom: "b/p", type: "Konsonan Dasar", awal: "B", akhir: "P" },
            { hangeul: "ㅅ", rom: "s", type: "Konsonan Dasar", awal: "S", akhir: "T" },
            { hangeul: "ㅇ", rom: "-/ng", type: "Konsonan Dasar", awal: "-", akhir: "NG" },
            { hangeul: "ㅈ", rom: "j", type: "Konsonan Dasar", awal: "J", akhir: "T" },
            { hangeul: "ㅊ", rom: "ch", type: "Konsonan Dasar", awal: "CH", akhir: "T" },
            { hangeul: "ㅋ", rom: "k", type: "Konsonan Dasar", awal: "K", akhir: "K" },
            { hangeul: "ㅌ", rom: "t", type: "Konsonan Dasar", awal: "T", akhir: "T" },
            { hangeul: "ㅍ", rom: "p", type: "Konsonan Dasar", awal: "P", akhir: "P" },
            { hangeul: "ㅎ", rom: "h", type: "Konsonan Dasar", awal: "H", akhir: "T" },

            // --- KONSONAN RANGKAP ---
            { hangeul: "ㄲ", rom: "kk", type: "Konsonan Rangkap", awal: "K (Kuat)", akhir: "K" },
            { hangeul: "ㄸ", rom: "tt", type: "Konsonan Rangkap", awal: "T (Kuat)", akhir: "-" },
            { hangeul: "ㅃ", rom: "pp", type: "Konsonan Rangkap", awal: "P (Kuat)", akhir: "-" },
            { hangeul: "ㅆ", rom: "ss", type: "Konsonan Rangkap", awal: "S (Kuat)", akhir: "T" },
            { hangeul: "ㅉ", rom: "jj", type: "Konsonan Rangkap", awal: "J (Kuat)", akhir: "-" },

            // --- VOKAL DASAR ---
            { hangeul: "ㅏ", rom: "a", type: "Vokal Dasar" },
            { hangeul: "ㅑ", rom: "ya", type: "Vokal Dasar" },
            { hangeul: "ㅓ", rom: "eo", type: "Vokal Dasar" },
            { hangeul: "ㅕ", rom: "yeo", type: "Vokal Dasar" },
            { hangeul: "ㅗ", rom: "o", type: "Vokal Dasar" },
            { hangeul: "ㅛ", rom: "yo", type: "Vokal Dasar" },
            { hangeul: "ㅜ", rom: "u", type: "Vokal Dasar" },
            { hangeul: "ㅠ", rom: "yu", type: "Vokal Dasar" },
            { hangeul: "ㅡ", rom: "eu", type: "Vokal Dasar" },
            { hangeul: "ㅣ", rom: "i", type: "Vokal Dasar" },

            // --- VOKAL RANGKAP / GABUNGAN ---
            { hangeul: "ㅐ", rom: "ae", type: "Vokal Rangkap" },
            { hangeul: "ㅒ", rom: "yae", type: "Vokal Rangkap" },
            { hangeul: "ㅔ", rom: "e", type: "Vokal Rangkap" },
            { hangeul: "ㅖ", rom: "ye", type: "Vokal Rangkap" },
            { hangeul: "ㅘ", rom: "wa", type: "Vokal Rangkap" },
            { hangeul: "ㅙ", rom: "wae", type: "Vokal Rangkap" },
            { hangeul: "ㅚ", rom: "oe", type: "Vokal Rangkap" },
            { hangeul: "ㅝ", rom: "wo", type: "Vokal Rangkap" },

        let isInCallMode = false;

        async function checkAudioAvailability() {
            try {
                // Check if browser supports mediaDevices
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    return false;
                }
                // Try to open stream briefly to trigger permission/check hardware
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop()); // Close stream immediately
                return true;
            } catch (err) {
                console.warn("Audio check failed:", err);
                return false;
            }
        }

        async function startCallMode() {
            // Check browser support
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Maaf, browser Anda tidak mendukung fitur Voice Call. Gunakan Google Chrome.");
                return;
            }

            document.getElementById('call-modal').classList.remove('hidden');
            updateCallStatus("Memeriksa Audio...", "Harap tunggu...");
            document.getElementById('avatar-ring').classList.remove('avatar-pulse');

            // Pre-check microphone availability
            const hasAudio = await checkAudioAvailability();
            
            if (!hasAudio) {
                 updateCallStatus("Mikrofon Error", "Tidak ada akses mikrofon");
                 document.getElementById('live-transcript').innerText = "Gagal mendeteksi mikrofon. Pastikan mic terpasang & diizinkan.";
                 document.getElementById('avatar-circle').classList.add('avatar-error');
                 isMicOn = false;
                 updateMicButtonUI();
                 return; // Stop here, don't start recognition loop
            }

            isInCallMode = true;
            isAiSpeaking = false;
            // Default to ON when starting
            isMicOn = true;
            
            resetChat(); // Start new context
            
            // Initialize Recognition
            recognition = new SpeechRecognition();
            recognition.lang = 'ko-KR'; // Listen for Korean
            recognition.continuous = false; // Stop after one sentence
            recognition.interimResults = true;

            recognition.onstart = () => {
                updateCallStatus("Mendengarkan...", "Silakan bicara bahasa Korea");
                document.getElementById('avatar-ring').classList.add('avatar-pulse');
                document.getElementById('avatar-circle').classList.remove('avatar-error');
                document.getElementById('live-transcript').innerText = "...";
            };

            recognition.onresult = (event) => {
                const transcript = Array.from(event.results)
                    .map(result => result[0])
                    .map(result => result.transcript)
                    .join('');

                document.getElementById('live-transcript').innerText = transcript;
                
                if (event.results[0].isFinal) {
                    // Send to AI immediately
                    recognition.stop(); // Stop listening immediately to prevent duplicate/echo
                    updateCallStatus("Memproses...", "AI sedang berpikir");
                    document.getElementById('avatar-ring').classList.remove('avatar-pulse');
                    sendMessage(transcript, true);
                }
            };

            recognition.onend = () => {
                // IMPORTANT: Restart logic to fix "sometimes not listening"
                // Only restart if call is active, mic is user-enabled, AI is NOT processing/typing, and AI is NOT speaking
                document.getElementById('avatar-ring').classList.remove('avatar-pulse');
                
                if (isInCallMode && isMicOn && !isTyping && !isAiSpeaking) {
                    // Restart gently
                    setTimeout(() => {
                        try { recognition.start(); } catch(e){}
                    }, 500);
                }
            };

            recognition.onerror = (event) => {
                console.warn("Speech recognition warning:", event.error);
                document.getElementById('avatar-ring').classList.remove('avatar-pulse');

                if (event.error === 'no-speech') {
                    // Silence handling: Restart is handled by onend usually, but good to have here
                } else if (event.error === 'audio-capture') {
                    updateCallStatus("Mikrofon Error", "Cek koneksi mic");
                    isMicOn = false;
                    updateMicButtonUI();
                } else if (event.error === 'not-allowed') {
                    updateCallStatus("Izin Ditolak", "Izinkan akses mikrofon");
                    isMicOn = false;
                    updateMicButtonUI();
                }
            };
            
            // Start listening initially
            setTimeout(() => {
                updateMicButtonUI(); // Ensure UI matches state
                startListening();
            }, 500);
        }

        function startListening() {
            if (isInCallMode && recognition && isMicOn && !isAiSpeaking) {

                }
            }
